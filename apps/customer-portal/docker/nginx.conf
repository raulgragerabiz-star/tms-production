server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta desconocida (ej. /pedidos/123) sirve
    # index.html para que React Router la resuelva en cliente. Mismo patrón
    # ya usado en backoffice/carrier-portal/app-conductor.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
