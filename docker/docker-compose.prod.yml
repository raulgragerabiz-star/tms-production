version: "3.9"

# Ejemplo de despliegue en producción usando las imágenes publicadas por el workflow de CD
# (ghcr.io/<owner>/tms-*:latest). No usa bind-mounts ni watch-mode; cada servicio ejecuta
# su build de producción (backend compilado + `prisma migrate deploy`, frontends servidos
# por nginx). Ajusta las variables de entorno reales (dominios, secretos, orígenes CORS)
# antes de usar esto tal cual en un servidor.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tms_prod}
    volumes:
      - tms_pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tms} -d ${POSTGRES_DB:-tms_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER:?falta GHCR_OWNER}/tms-backend:${TMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tms_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:?falta CORS_ORIGIN, ej. https://tms.tudominio.com,https://transportistas.tudominio.com,https://conductor.tudominio.com}
      # Fase 8c: faltaba pasar estas dos variables al contenedor de producción.
      # Esta imagen de backend usa la publicada por CD (sin bind-mount del
      # código ni del .env), así que aunque backend/.env tenga ORS_API_KEY
      # relleno, este compose lo ignoraba por completo -- la clave real debe
      # venir del entorno donde se ejecuta `docker compose` (host o secreto de
      # CI), igual que ya pasa con JWT_SECRET/POSTGRES_PASSWORD arriba. Ambas
      # son opcionales a propósito (ver env.ts): sin ORS_API_KEY, el sistema
      # sigue funcionando igual que hasta ahora (rutas por línea recta, sin
      # geocodificación automática), solo que sin planificación automática
      # por VROOM ni geocodificación.
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_PROFILE: ${ORS_PROFILE:-driving-hgv}
    ports:
      - "4000:4000"

  frontend:
    image: ghcr.io/${GHCR_OWNER:?falta GHCR_OWNER}/tms-frontend:${TMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  carrier-portal:
    image: ghcr.io/${GHCR_OWNER:?falta GHCR_OWNER}/tms-carrier-portal:${TMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

  driver-app:
    image: ghcr.io/${GHCR_OWNER:?falta GHCR_OWNER}/tms-driver-app:${TMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  tms_pg_data_prod:
