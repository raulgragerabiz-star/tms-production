name: Deploy TMS (Cloud Run + Firebase Hosting)

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions, útil justo antes de la presentación

env:
  GCP_REGION: europe-west1
  CLOUD_RUN_SERVICE: tms-backend

jobs:
  # --------------------------------------------------------------------
  # Tests del backend — gate antes de desplegar nada. Si fallan, no se
  # despliega (mejor una demo que no se actualiza que una rota en directo).
  # --------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --workspace=backend
      - run: npx prisma db push --workspace=backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tms_test
      - run: npm test --workspace=backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tms_test
          DISABLE_SCHEDULED_JOBS: "true"

  # --------------------------------------------------------------------
  # Backend -> Cloud Run
  # --------------------------------------------------------------------
  deploy-backend:
    needs: backend-tests
    runs-on: ubuntu-latest
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: deploy
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --source backend \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --set-env-vars NODE_ENV=production \
            --set-env-vars DISABLE_SCHEDULED_JOBS=true \
            --port 4000 \
            --quiet
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------
  # 4 frontends -> Firebase Hosting (multi-site). Cada uno recibe la URL
  # real de Cloud Run recién desplegado como VITE_API_BASE_URL de build.
  # --------------------------------------------------------------------
  deploy-frontends:
    needs: deploy-backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { path: apps/backoffice, target: backoffice }
          - { path: apps/carrier-portal, target: carrier-portal }
          - { path: apps/app-conductor, target: driver-app }
          - { path: apps/customer-portal, target: customer-portal }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build ${{ matrix.app.target }}
        working-directory: ${{ matrix.app.path }}
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-backend.outputs.service_url }}

      - name: Deploy ${{ matrix.app.target }} to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.GCP_SA_KEY }}"
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          target: ${{ matrix.app.target }}
          channelId: live
