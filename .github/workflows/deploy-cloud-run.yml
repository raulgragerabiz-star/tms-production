name: Deploy a Cloud Run

# Este workflow es lo que hace que backend + los 3 frontends sigan funcionando
# aunque el Codespace esté parado: en cada push a main construye las imágenes
# Docker (los Dockerfile.prod que ya existían en el repo) y las despliega como
# 4 servicios de Cloud Run, que corren de forma independiente y permanente en
# Google Cloud. La base de datos sigue siendo la misma de Neon (DATABASE_URL),
# no se crea ningún Postgres nuevo.
#
# Fase 26 ("usuarios app" sub-fase 4): antes eran 4 frontends / 5 servicios --
# el 5º era tms-carrier-portal (Portal Transportista), retirado por completo
# (petición explícita de Raúl: "carece de sentido"). Ver
# claude/fase26-retirada-portal-transportista.md.
#
# Requiere que antes se haya hecho, UNA SOLA VEZ, la configuración manual de GCP
# (repositorio de Artifact Registry + cuenta de servicio) y que existan estos
# secretos en GitHub (Settings → Secrets and variables → Actions). Sin guion bajo
# a propósito (el signo "_" dio problemas al crear el secreto GCP_SA_KEY):
#   GCPPROJECTID, GCPSAKEY, DATABASEURL, JWTSECRET, VITEGOOGLEMAPSAPIKEY
#
# ORSAPIKEY (Fase 8d) es OPCIONAL -- si no se crea este secreto, el backend
# arranca igual y todo el sistema sigue funcionando como hasta ahora (rutas
# por línea recta, sin geocodificación automática ni planificación con
# VROOM, ver env.ts). Si SÍ se crea, hay que rellenarla aquí con la clave
# real de OpenRouteService: hasta ahora este workflow no la incluía en
# /tmp/backend-env.yaml, y como --env-vars-file reemplaza TODAS las
# variables del servicio en cada push (ver nota más abajo), cualquier
# ORS_API_KEY puesta a mano en la consola de Cloud Run se borraba en el
# siguiente despliegue -- exactamente lo que le pasaba a Raúl.
#
# Fase 21 (corrección): los 5 pasos "Build y push" reintentan el `docker
# build` hasta 3 veces con espera de 15s -- a Raúl le falló un despliegue
# con "failed to fetch oauth token ... connection reset by peer" al tirar de
# la imagen base pública de Docker Hub (nginx:1.27-alpine), un corte de red
# puntual entre el runner de GitHub y Docker Hub, no un problema del
# Dockerfile ni del código. Si el fallo persiste tras los 3 reintentos (algo
# más grave que un corte puntual, p.ej. Docker Hub caído o limitando por
# rate-limit), el job sigue fallando igual que antes -- esto no lo esconde,
# solo absorbe el caso típico de corte transitorio.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGION: europe-west1
  REPO: tms

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.describe.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSAKEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push de la imagen del backend
        run: |
          set -e
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCPPROJECTID }}/${{ env.REPO }}/tms-backend:${{ github.sha }}"
          # Reintentamos el build: nos ha pasado que "docker build" falla al
          # tirar de una imagen base pública de Docker Hub (nginx/node) con
          # "failed to fetch oauth token: ... connection reset by peer" -- un
          # corte de red puntual entre el runner de GitHub y Docker Hub, no un
          # problema del Dockerfile ni del código. Mismo criterio de reintento
          # que ya se usa más abajo para "describe" la URL de Cloud Run.
          n=0
          until [ "$n" -ge 3 ]; do
            docker build -f backend/Dockerfile.prod -t "$IMAGE" backend && break
            n=$((n + 1))
            echo "docker build falló (intento $n/3), reintentando en 15s..."
            sleep 15
          done
          if [ "$n" -ge 3 ]; then
            echo "ERROR: docker build del backend siguió fallando tras 3 intentos"
            exit 1
          fi
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Despliegue en Cloud Run
        env:
          # Igual que en el build del backoffice: pasar los secretos por env de step y
          # escribirlos en un --env-vars-file (YAML) en vez de una lista pegada con comas
          # (--update-env-vars/--set-env-vars) evita que un valor con caracteres raros
          # (o, como nos paso, un secreto que llevaba "DATABASE_URL=" duplicado dentro del
          # propio valor) rompa el parseo o haga desaparecer otra variable de la lista.
          # NOTA: --env-vars-file REEMPLAZA todas las variables (no las combina), asi que
          # CORS_ORIGIN se pierde brevemente hasta que el ultimo job de este mismo workflow
          # (update-backend-cors) lo vuelve a fijar al final de la ejecucion.
          DATABASE_URL_VALUE: ${{ secrets.DATABASEURL }}
          JWT_SECRET_VALUE: ${{ secrets.JWTSECRET }}
          # Fase 8d: si el secreto ORSAPIKEY no existe todavia en GitHub, esto
          # queda como cadena vacia y ORS_API_KEY se escribe vacia en Cloud Run
          # -- exactamente el mismo comportamiento "sin configurar" que ya
          # tenia el sistema hasta ahora (ver env.ts), nunca rompe el deploy.
          ORS_API_KEY_VALUE: ${{ secrets.ORSAPIKEY }}
        run: |
          set -e
          cat > /tmp/backend-env.yaml <<EOF
          NODE_ENV: "production"
          JWT_EXPIRES_IN: "8h"
          DATABASE_URL: "${DATABASE_URL_VALUE}"
          JWT_SECRET: "${JWT_SECRET_VALUE}"
          ORS_API_KEY: "${ORS_API_KEY_VALUE}"
          EOF
          gcloud run deploy tms-backend \
            --project="${{ secrets.GCPPROJECTID }}" \
            --region="${{ env.REGION }}" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --env-vars-file=/tmp/backend-env.yaml

      - name: Leer la URL pública asignada
        id: describe
        run: |
          # Reintentamos unas veces: la primera vez que se crea un servicio de Cloud Run,
          # status.url puede tardar unos segundos en poblarse justo despues del `gcloud run
          # deploy` anterior (nos paso una vez con tms-backoffice: URL vacia -> CORS roto).
          for i in 1 2 3 4 5; do
            URL=$(gcloud run services describe tms-backend --project="${{ secrets.GCPPROJECTID }}" --region="${{ env.REGION }}" --format='value(status.url)')
            if [ -n "$URL" ]; then break; fi
            echo "URL todavia vacia, esperando 5s (intento $i)..."
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "ERROR: no se pudo obtener la URL de tms-backend tras varios intentos"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-backoffice:
    needs: deploy-backend
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.describe.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSAKEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push (backoffice)
        env:
          # Pasar los secretos por env de step (no interpolarlos directamente dentro del
          # script de bash con ${{ secrets.X }}) evita que un carácter raro (comilla,
          # salto de línea) que pueda tener el valor del secreto rompa la sintaxis del
          # script — bash siempre lo trata como una única variable, pase lo que pase dentro.
          VITE_GOOGLE_MAPS_API_KEY_VALUE: ${{ secrets.VITEGOOGLEMAPSAPIKEY }}
          BACKEND_URL_VALUE: ${{ needs.deploy-backend.outputs.url }}
        run: |
          set -e
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCPPROJECTID }}/${{ env.REPO }}/tms-backoffice:${{ github.sha }}"
          # Ver comentario de reintento en el build del backend -- mismo
          # motivo (corte de red puntual tirando de la imagen base de Docker
          # Hub, p.ej. nginx:1.27-alpine), no un problema de este Dockerfile.
          n=0
          until [ "$n" -ge 3 ]; do
            docker build -f frontend/Dockerfile.prod \
              --build-arg VITE_API_URL="${BACKEND_URL_VALUE}/api" \
              --build-arg VITE_GOOGLE_MAPS_API_KEY="${VITE_GOOGLE_MAPS_API_KEY_VALUE}" \
              -t "$IMAGE" frontend && break
            n=$((n + 1))
            echo "docker build falló (intento $n/3), reintentando en 15s..."
            sleep 15
          done
          if [ "$n" -ge 3 ]; then
            echo "ERROR: docker build del backoffice siguió fallando tras 3 intentos"
            exit 1
          fi
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Despliegue en Cloud Run
        run: |
          gcloud run deploy tms-backoffice \
            --project="${{ secrets.GCPPROJECTID }}" \
            --region="${{ env.REGION }}" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated \
            --port=80

      - id: describe
        run: |
          # Reintentamos unas veces: la primera vez que se crea un servicio de Cloud Run,
          # status.url puede tardar unos segundos en poblarse justo despues del `gcloud run
          # deploy` anterior (nos paso una vez con tms-backoffice: URL vacia -> CORS roto).
          for i in 1 2 3 4 5; do
            URL=$(gcloud run services describe tms-backoffice --project="${{ secrets.GCPPROJECTID }}" --region="${{ env.REGION }}" --format='value(status.url)')
            if [ -n "$URL" ]; then break; fi
            echo "URL todavia vacia, esperando 5s (intento $i)..."
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "ERROR: no se pudo obtener la URL de tms-backoffice tras varios intentos"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # Fase 26 ("usuarios app" sub-fase 4): el job deploy-carrier-portal (apps/carrier-portal,
  # servicio Cloud Run tms-carrier-portal) se retiró por completo -- petición explícita de
  # Raúl ("carece de sentido"), ver claude/fase26-retirada-portal-transportista.md. El
  # servicio YA DESPLEGADO en Cloud Run no se borra solo -- hay que borrarlo a mano una vez
  # (gcloud run services delete tms-carrier-portal --project=<PROJECT_ID> --region=europe-west1),
  # ver ese mismo doc para el paso a paso completo.

  deploy-driver-app:
    needs: deploy-backend
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.describe.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSAKEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push (driver-app)
        run: |
          set -e
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCPPROJECTID }}/${{ env.REPO }}/tms-driver-app:${{ github.sha }}"
          # Ver comentario de reintento en el build del backend.
          n=0
          until [ "$n" -ge 3 ]; do
            docker build -f apps/driver-app/Dockerfile.prod \
              --build-arg VITE_API_URL="${{ needs.deploy-backend.outputs.url }}/api" \
              -t "$IMAGE" apps/driver-app && break
            n=$((n + 1))
            echo "docker build falló (intento $n/3), reintentando en 15s..."
            sleep 15
          done
          if [ "$n" -ge 3 ]; then
            echo "ERROR: docker build del driver-app siguió fallando tras 3 intentos"
            exit 1
          fi
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Despliegue en Cloud Run
        run: |
          gcloud run deploy tms-driver-app \
            --project="${{ secrets.GCPPROJECTID }}" \
            --region="${{ env.REGION }}" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated \
            --port=80

      - id: describe
        run: |
          # Reintentamos unas veces: la primera vez que se crea un servicio de Cloud Run,
          # status.url puede tardar unos segundos en poblarse justo despues del `gcloud run
          # deploy` anterior (nos paso una vez con tms-backoffice: URL vacia -> CORS roto).
          for i in 1 2 3 4 5; do
            URL=$(gcloud run services describe tms-driver-app --project="${{ secrets.GCPPROJECTID }}" --region="${{ env.REGION }}" --format='value(status.url)')
            if [ -n "$URL" ]; then break; fi
            echo "URL todavia vacia, esperando 5s (intento $i)..."
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "ERROR: no se pudo obtener la URL de tms-driver-app tras varios intentos"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-customer-portal:
    needs: deploy-backend
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.describe.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSAKEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push (customer-portal)
        run: |
          set -e
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCPPROJECTID }}/${{ env.REPO }}/tms-customer-portal:${{ github.sha }}"
          # OJO: este cliente usa VITE_API_BASE_URL (sin sufijo /api, ver
          # apps/customer-portal/src/api/client.ts) — es distinto al resto de apps.
          # Ver comentario de reintento en el build del backend.
          n=0
          until [ "$n" -ge 3 ]; do
            docker build -f apps/customer-portal/Dockerfile.prod \
              --build-arg VITE_API_BASE_URL="${{ needs.deploy-backend.outputs.url }}" \
              -t "$IMAGE" apps/customer-portal && break
            n=$((n + 1))
            echo "docker build falló (intento $n/3), reintentando en 15s..."
            sleep 15
          done
          if [ "$n" -ge 3 ]; then
            echo "ERROR: docker build del customer-portal siguió fallando tras 3 intentos"
            exit 1
          fi
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Despliegue en Cloud Run
        run: |
          gcloud run deploy tms-customer-portal \
            --project="${{ secrets.GCPPROJECTID }}" \
            --region="${{ env.REGION }}" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated \
            --port=80

      - id: describe
        run: |
          # Reintentamos unas veces: la primera vez que se crea un servicio de Cloud Run,
          # status.url puede tardar unos segundos en poblarse justo despues del `gcloud run
          # deploy` anterior (nos paso una vez con tms-backoffice: URL vacia -> CORS roto).
          for i in 1 2 3 4 5; do
            URL=$(gcloud run services describe tms-customer-portal --project="${{ secrets.GCPPROJECTID }}" --region="${{ env.REGION }}" --format='value(status.url)')
            if [ -n "$URL" ]; then break; fi
            echo "URL todavia vacia, esperando 5s (intento $i)..."
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "ERROR: no se pudo obtener la URL de tms-customer-portal tras varios intentos"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # Los 3 frontends solo obtienen su URL pública de Cloud Run DESPUÉS de su primer
  # despliegue (arriba), así que el CORS del backend no puede fijarse hasta este punto
  # — de ahí este último paso, que actualiza el backend ya desplegado con los 3 orígenes
  # reales en cuanto se conocen. En despliegues posteriores las URLs no cambian (Cloud Run
  # las mantiene estables mientras no se borre el servicio), así que este paso es idempotente.
  update-backend-cors:
    needs: [deploy-backend, deploy-backoffice, deploy-driver-app, deploy-customer-portal]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSAKEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Actualizar CORS_ORIGIN del backend con las 4 URLs reales
        run: |
          set -e
          # No confiamos en needs.<job>.outputs.url: nos ha llegado vacio mas de una vez
          # pese a que el job de origen termino bien y el servicio ya tenia URL real (bug de
          # propagacion de outputs entre jobs de GitHub Actions que nunca hemos podido
          # aislar). En su lugar, preguntamos directamente a Cloud Run por cada servicio
          # (los 4 son dependencias de este job, ya estan desplegados) con el mismo
          # reintento que ya usan los pasos "describe" de cada job de despliegue.
          get_url() {
            local service="$1"
            local url=""
            for i in 1 2 3 4 5; do
              url=$(gcloud run services describe "$service" --project="${{ secrets.GCPPROJECTID }}" --region="${{ env.REGION }}" --format='value(status.url)')
              if [ -n "$url" ]; then break; fi
              echo "  ($service) URL todavia vacia, esperando 5s (intento $i)..." >&2
              sleep 5
            done
            echo "$url"
          }

          BACKOFFICE_URL=$(get_url tms-backoffice)
          DRIVER_URL=$(get_url tms-driver-app)
          CUSTOMER_URL=$(get_url tms-customer-portal)

          ORIGINS=""
          for url in "$BACKOFFICE_URL" "$DRIVER_URL" "$CUSTOMER_URL"; do
            if [ -n "$url" ]; then
              if [ -z "$ORIGINS" ]; then ORIGINS="$url"; else ORIGINS="$ORIGINS,$url"; fi
            fi
          done

          if [ -z "$ORIGINS" ]; then
            echo "ERROR: no se pudo obtener ninguna de las 4 URLs de frontend tras varios intentos"
            exit 1
          fi

          echo "CORS_ORIGIN a fijar: $ORIGINS"

          # El delimitador "^;^" le dice a gcloud que separe pares KEY=VALUE por ";" en vez
          # de por ",", dejando la coma libre para usarla dentro del propio valor (aqui
          # llevamos varias URLs separadas por comas dentro de un unico valor CORS_ORIGIN).
          # Sin esto gcloud trocea por cada coma como si fuera otro par KEY=VALUE y revienta
          # con "Bad syntax for dict arg" -- el error que nos ha venido dando siempre, tanto
          # con las 4 URLs completas como cuando alguna llegaba vacia.
          gcloud run services update tms-backend \
            --project="${{ secrets.GCPPROJECTID }}" \
            --region="${{ env.REGION }}" \
            --update-env-vars="^;^CORS_ORIGIN=$ORIGINS"
